name: yttest
on:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - run: |
          pip install -q yt-dlp imageio-ffmpeg
          python3 - <<'PY'
          import yt_dlp, glob
          for client in ['android_vr', 'tv_embedded', 'web_safari']:
              opts = {'format':'bestaudio/best','outtmpl':'/tmp/t-%(id)s.%(ext)s','quiet':True,'no_warnings':True,
                      'extractor_args':{'youtube':{'player_client':[client]}}}
              try:
                  with yt_dlp.YoutubeDL(opts) as ydl:
                      info = ydl.extract_info('ytsearch1:shir hashirim', download=False)
                      ent = info['entries'][0]
                      ydl.download([ent['webpage_url']])
                  f = sorted(glob.glob('/tmp/t-*'))
                  print('CLIENT_OK', client, ent.get('title'), f)
                  break
              except Exception as e:
                  print('CLIENT_FAIL', client, str(e)[:150])
          PY
