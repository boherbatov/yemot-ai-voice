[phases.setup]
nixPkgs = ["python312", "ffmpeg", "nodejs_22", "git"]

[phases.install]
cmds = ["mkdir -p /app/bin && /usr/bin/env python3 -c \"import urllib.request as u;u.urlretrieve('https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/qjs-linux-x86_64','/app/bin/qjs')\" && chmod 755 /app/bin/qjs && /app/bin/qjs --help >/dev/null", "python -m venv /opt/venv && /opt/venv/bin/pip install --no-cache-dir -r requirements.txt && /opt/venv/bin/python youtube_solver_check.py", "git clone --single-branch --branch 2.0.0 --depth 1 https://github.com/Brainicism/bgutil-ytdlp-pot-provider.git /app/pot && cd /app/pot/server && npm ci && npm install --no-save node@22.23.3 && npx tsc"]

[start]
cmd = "sh start.sh"
