[phases.setup]
nixPkgs = ["python312", "ffmpeg", "deno"]

[phases.install]
cmds = ["python -m venv /opt/venv && /opt/venv/bin/pip install --no-cache-dir -r requirements.txt"]

[start]
cmd = "/opt/venv/bin/gunicorn -b 0.0.0.0:${PORT:-10000} -w 1 -k gthread --threads 8 -t 180 --access-logfile - app:app"
